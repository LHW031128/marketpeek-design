<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MarketPeek · 디자인 보기</title>
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<style>
:root{--accent:#C2410C;--ink:#15181e;--sub:#5b6370;--faint:#6b7280;--line:#e2e5ea;--bg:#f5f6f8;--card:#ffffff}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Segoe UI","Malgun Gothic","Noto Sans KR",sans-serif;color:var(--ink);background:var(--bg);word-break:keep-all;-webkit-font-smoothing:antialiased;line-height:1.5}
a{color:inherit}
.wrap{max-width:1240px;margin:0 auto;padding:0 24px}
.brand{display:inline-flex;align-items:center;gap:10px;font-weight:700;font-size:15px;text-decoration:none}
.brand img{width:26px;height:26px;display:block}
.ghlink{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;text-decoration:none;padding:8px 12px;border:1px solid var(--line);border-radius:999px;background:var(--card)}
.ghlink:hover{border-color:var(--ink)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
body{background:#e9ecf0;transition:background .2s ease}
.bar{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:12px;height:60px;padding:0 16px;background:rgba(255,255,255,.96);border-bottom:1px solid var(--line);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.back{flex:0 0 auto;font-size:13.5px;font-weight:600;text-decoration:none;padding:8px 10px;border-radius:8px}
.back:hover{background:var(--bg)}
.info{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;line-height:1.3}
.grp{font-size:11.5px;font-weight:700;color:var(--accent);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ttl{font-size:14.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctrl{flex:0 0 auto;display:flex;align-items:center;gap:6px}
.count{font-size:12px;color:var(--faint);margin-right:4px;font-variant-numeric:tabular-nums}
.ctrl button,.ctrl a{display:inline-flex;align-items:center;justify-content:center;min-width:40px;height:40px;padding:0 12px;border:1px solid var(--line);border-radius:10px;background:#fff;font:inherit;font-size:13px;font-weight:600;color:var(--ink);text-decoration:none;cursor:pointer}
.ctrl button:hover,.ctrl a:hover{border-color:var(--ink)}
.ctrl button:disabled{opacity:.35;cursor:default;border-color:var(--line)}
.stage{display:flex;justify-content:center;padding:28px 16px 40px}
.stage img{display:block;max-width:100%;height:auto}
.hint{text-align:center;font-size:12px;margin:0 0 40px;color:var(--sub)}
body.dark .hint{color:#9ca3af}
@media (max-width:620px){.ctrl .count,.ctrl .open{display:none}.bar{gap:8px;padding:0 10px}.back{padding:8px 6px}.hint{display:none}}
</style>
</head>
<body>
<header class="bar">
<a class="back" href="./">← 전체 디자인</a>
<div class="info"><span class="grp"></span><strong class="ttl"></strong></div>
<div class="ctrl"><span class="count"></span><button type="button" class="prev" aria-label="이전 디자인">‹</button><button type="button" class="next" aria-label="다음 디자인">›</button><a class="open" target="_blank" rel="noopener">PNG</a></div>
</header>
<main class="stage"><img alt=""></main>
<p class="hint">키보드 ← → 로 순서대로 넘겨 볼 수 있어요 · 수치는 디자인용 예시 데이터예요</p>

const byId = {}; DESIGNS.forEach((d, i) => { d.i = i; byId[d.id] = d; });
const img = document.querySelector('.stage img'), grp = document.querySelector('.grp'), ttl = document.querySelector('.ttl');
const count = document.querySelector('.count'), prev = document.querySelector('.prev'), next = document.querySelector('.next'), open = document.querySelector('.open');
let cur = null;
function isDark(hex) {
  if (!hex) return false;
  const n = parseInt(hex.slice(1), 16), r = n >> 16, g = (n >> 8) & 255, b = n & 255;
  return (0.2126 * r + 0.7152 * g + 0.0722 * b) < 128;
}
function show(id) {
  const d = byId[id] || DESIGNS[0];
  cur = d;
  const src = 'designs/' + d.f + '/' + encodeURIComponent(d.id) + '.png';
  grp.textContent = d.p + ' · ' + d.s; ttl.textContent = d.t + ' — ' + d.k;
  count.textContent = (d.i + 1) + ' / ' + DESIGNS.length;
  prev.disabled = d.i === 0; next.disabled = d.i === DESIGNS.length - 1;
  open.href = src;
  img.src = src; img.width = d.w; img.height = d.h; img.alt = d.t;
  document.body.style.background = d.bg || '#e9ecf0';
  document.body.classList.toggle('dark', isDark(d.bg));
  document.title = d.t + ' · MarketPeek 디자인';
  history.replaceState(null, '', '?s=' + encodeURIComponent(d.id));
}
prev.addEventListener('click', () => cur && cur.i > 0 && show(DESIGNS[cur.i - 1].id));
next.addEventListener('click', () => cur && cur.i < DESIGNS.length - 1 && show(DESIGNS[cur.i + 1].id));
document.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowLeft') prev.click();
  if (e.key === 'ArrowRight') next.click();
});
show(new URLSearchParams(location.search).get('s'));
</script>
